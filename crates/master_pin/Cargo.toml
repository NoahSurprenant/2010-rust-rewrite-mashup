[package]
name = "master_pin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Trust in an iw4l-master by the SHA-256 of its public key, shared by iw4l and iw4l-master."

[dependencies]
ring = "0.17"
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc", "ring"] }

[lints]
workspace = true
