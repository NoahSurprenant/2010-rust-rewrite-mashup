{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
# Nothing in: players reach the server through the master's relay. Out: DNS, the master's QUIC
# port, and public HTTPS (Mojang's file servers). Nothing else on the private ranges.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iw4l-dedicated.fullname" . }}
  labels:
    {{- include "iw4l-dedicated.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iw4l-dedicated.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- with $np.extraIngress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to:
        {{- toYaml $np.dns.to | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: UDP
          port: {{ include "iw4l-dedicated.masterPort" . }}
      {{- with $np.master.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if $np.internet.tcpPorts }}
    - to:
        - ipBlock:
            cidr: {{ $np.internet.cidr }}
            {{- with $np.internet.except }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
      ports:
        {{- range $np.internet.tcpPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
