apiVersion: v2
name: iw4l-dedicated
description: >-
  The IW4L dedicated server: `iw4l dedicated <zone>`, a headless game with no player of its own that
  keeps one room open on an IW4L master. MW2's game data is mounted from a volume you provide.
type: application
# The major and minor: the Helm chart workflow publishes each change as <major>.<minor>.<run number>
# (oci://ghcr.io/noahsurprenant/charts, signed with cosign), so only a major or minor bump is an edit
# here.
version: 0.3.0
# The Kubernetes versions the Helm chart workflow tests. Raise it as old minors reach end of life.
kubeVersion: ">=1.34.0-0"
# Informational only: which image runs is set by image.repository, image.tag and image.digest.
appVersion: "latest"
home: https://github.com/NoahSurprenant/2010-rust-rewrite-mashup
sources:
  - https://github.com/NoahSurprenant/2010-rust-rewrite-mashup
keywords:
  - iw4l
  - game-server
  - minecraft
