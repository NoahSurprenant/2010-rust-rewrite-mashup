suite: service
templates:
  - templates/service.yaml
release:
  name: iw4l-master
tests:
  - it: exposes UDP 4433 on a ClusterIP by default
    asserts:
      - equal: { path: spec.type, value: ClusterIP }
      - equal: { path: 'spec.ports[0]', value: { name: quic, port: 4433, targetPort: quic, protocol: UDP } }
      - notExists: { path: spec.externalTrafficPolicy }
      - equal: { path: spec.selector, value: { app.kubernetes.io/name: iw4l-master, app.kubernetes.io/instance: iw4l-master } }

  - it: takes a load balancer's address, annotations and traffic policy
    set:
      service:
        type: LoadBalancer
        loadBalancerIP: 192.0.2.10
        annotations: { metallb.io/loadBalancerIPs: 192.0.2.10 }
        externalTrafficPolicy: Local
        nodePort: 30433
        loadBalancerSourceRanges: [198.51.100.0/24]
    asserts:
      - equal: { path: spec.type, value: LoadBalancer }
      - equal: { path: spec.loadBalancerIP, value: 192.0.2.10 }
      - equal: { path: metadata.annotations, value: { metallb.io/loadBalancerIPs: 192.0.2.10 } }
      - equal: { path: spec.externalTrafficPolicy, value: Local }
      - equal: { path: 'spec.ports[0].nodePort', value: 30433 }
      - equal: { path: spec.loadBalancerSourceRanges, value: [198.51.100.0/24] }

  - it: leaves load balancer fields off a ClusterIP
    set:
      service: { loadBalancerIP: 192.0.2.10, externalTrafficPolicy: Local, nodePort: 30433 }
    asserts:
      - notExists: { path: spec.loadBalancerIP }
      - notExists: { path: spec.externalTrafficPolicy }
      - notExists: { path: 'spec.ports[0].nodePort' }
