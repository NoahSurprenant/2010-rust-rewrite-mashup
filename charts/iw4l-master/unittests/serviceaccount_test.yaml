suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
tests:
  - it: leaves the default ServiceAccount alone by default
    asserts:
      - hasDocuments: { count: 0 }
  - it: manages it without a token when asked
    set:
      defaultServiceAccount.manage: true
    asserts:
      - equal: { path: metadata.name, value: default }
      - equal: { path: automountServiceAccountToken, value: false }
