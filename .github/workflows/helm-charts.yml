name: Helm charts

# The charts under charts/: iw4l-master (the master server) and iw4l-dedicated (the dedicated server).
# Pull requests: lint, unit tests (helm-unittest, each chart's unittests/), every ci/*-values.yaml
# rendered and checked against the Kubernetes schemas, and an end-to-end install on k3s (k3d) with
# the published images, on Kubernetes 1.34 to 1.37.
# main: the same, then each chart that changed is published to
# oci://ghcr.io/noahsurprenant/charts/<chart> as <its Chart.yaml's major.minor>.<run number>, signed
# keyless with cosign. The charts are versioned independently: one that did not change is not
# published.
on:
  pull_request:
    branches: [main]
    paths: ["charts/**", ".github/workflows/helm-charts.yml"]
  push:
    branches: [main]
    paths: ["charts/**", ".github/workflows/helm-charts.yml"]
  workflow_dispatch:

concurrency:
  group: helm-charts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Lowercase: OCI references are.
  CHART_REPO: oci://ghcr.io/noahsurprenant/charts
  # The Kubernetes versions supported (Chart.yaml kubeVersion): the oldest and the newest.
  KUBERNETES_OLDEST: "1.34.0"
  KUBERNETES_NEWEST: "1.37.0"

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        chart: [iw4l-master, iw4l-dedicated]
    name: test (${{ matrix.chart }})
    env:
      CHART: charts/${{ matrix.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint
        run: |
          set -euo pipefail
          for values in "$CHART"/ci/*-values.yaml; do
            echo "::group::helm lint -f $values"
            helm lint "$CHART" --strict -f "$values"
            echo "::endgroup::"
          done
          # The defaults alone are not an install of the dedicated server: it needs MW2 and a
          # master. The master's defaults are (cert-manager makes its certificate).
          if [ "${{ matrix.chart }}" = iw4l-dedicated ] && helm template ci "$CHART" >/dev/null 2>&1; then
            echo "::error::The chart renders without gameData and a master"; exit 1
          fi

      - name: Unit tests
        run: |
          set -euo pipefail
          # Helm 4 verifies plugin signatures by default; helm-unittest publishes none.
          if helm version --short | grep -q '^v3'; then verify=; else verify=--verify=false; fi
          helm plugin install https://github.com/helm-unittest/helm-unittest $verify
          # unittests/, not tests/: `make publish-check` keeps tests/ folders to crates/approved_tests.
          helm unittest -f 'unittests/*_test.yaml' "$CHART"

      - name: Schema check
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          # Older than the oldest supported must be refused (Chart.yaml kubeVersion).
          if helm template ci "$CHART" -f "$CHART/ci/minimal-values.yaml" --kube-version 1.33.0 >/dev/null 2>&1; then
            echo "::error::The chart renders for Kubernetes 1.33, older than its kubeVersion allows"; exit 1
          fi
          for k8s in "$KUBERNETES_OLDEST" "$KUBERNETES_NEWEST"; do
          for values in "$CHART"/ci/*-values.yaml; do
            echo "::group::$values, Kubernetes $k8s"
            # cert-manager's Issuer and Certificate from the CRDs catalog.
            helm template ci "$CHART" -n iw4l-ci -f "$values" --kube-version "$k8s" \
              | ./kubeconform -strict -summary -kubernetes-version "$k8s" -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done
          done

  # The charts on a real cluster (k3s in Docker, which enforces NetworkPolicies), on the oldest, a
  # middle and the newest supported Kubernetes: charts/<chart>/e2e/run.sh, with the published
  # images (neither chart builds code).
  e2e:
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        chart: [iw4l-master, iw4l-dedicated]
        k3s: [v1.34.12-k3s1, v1.36.5-k3s1, v1.37.1-k3s1]
    name: e2e (${{ matrix.chart }}, ${{ matrix.k3s }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Cluster
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/k3d https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64
          chmod +x /usr/local/bin/k3d
          k3d cluster create e2e --image "rancher/k3s:${{ matrix.k3s }}" --no-lb \
            --k3s-arg '--disable=traefik@server:0' --wait --timeout 180s
          kubectl version

      - name: End-to-end
        run: charts/${{ matrix.chart }}/e2e/run.sh

  # Publishes each chart that changed: version <its Chart.yaml's major.minor>.<this workflow's run
  # number>, so every change gets a new version without anyone bumping it; a major or minor bump is
  # a Chart.yaml edit. Then signs it keyless with cosign (Sigstore) and checks the signature.
  publish:
    needs: [test, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        chart: [iw4l-master, iw4l-dedicated]
    name: publish (${{ matrix.chart }})
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      NAME: ${{ matrix.chart }}
      CHART: charts/${{ matrix.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Did the chart change?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # A push that didn't touch this chart (only the other one, say) publishes nothing; a manual
          # run or an unknown base always does.
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             && git diff --quiet "$BEFORE" HEAD -- "$CHART"; then
            echo "$NAME didn't change: nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.changed.outputs.publish == 'true'

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.changed.outputs.publish == 'true'

      - name: Publish and sign
        if: steps.changed.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/helm-charts\.yml@refs/heads/main$
        run: |
          set -euo pipefail
          echo "$TOKEN" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          # cosign reads the registry credentials from Docker's config.
          echo "$TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          base=$(sed -n 's/^version: *//p' "$CHART/Chart.yaml")
          version="${base%.*}.${{ github.run_number }}"
          # A re-run of this run would reuse its number: never overwrite a published version.
          if helm show chart "$CHART_REPO/$NAME" --version "$version" >/dev/null 2>&1; then
            echo "$NAME $version is already published; not overwriting it."
            exit 0
          fi
          helm package "$CHART" --version "$version" -d dist
          helm push "dist/$NAME-$version.tgz" "$CHART_REPO" 2>&1 | tee push.txt
          digest=$(sed -n 's/^Digest: *//p' push.txt)
          test -n "$digest"
          ref="${CHART_REPO#oci://}/$NAME@$digest"
          cosign sign --yes "$ref"
          cosign verify "$ref" --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          {
            echo "Published and signed $CHART_REPO/$NAME:$version ($digest)."
            echo
            echo "Verify: cosign verify ${ref%@*}:$version --certificate-identity-regexp '$IDENTITY' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
          } >> "$GITHUB_STEP_SUMMARY"
