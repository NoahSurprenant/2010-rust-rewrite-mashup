name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What needs no game data runs on GitHub's runners.
  checks:
    name: approved_tests unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p approved_tests

  # The approved crafting_table scenario plays the real game on the
  # Minecraft map, so it needs the owner's MW2 files, which only the
  # in-cluster runner has (mounted read-only at /skate-assets/mw2). The
  # runner can read them and reach the internet, so a pull request from a
  # fork never runs here; the repository also requires approval before an
  # outside contributor's workflow runs.
  crafting-table:
    name: crafting_table (MW2 + Minecraft, in-cluster)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: iw4l-k8s
    timeout-minutes: 60
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: play
      # Minecraft's files, fetched from Mojang on the first run.
      - uses: actions/cache@v4
        with:
          path: iw4l-artifacts/minecraft-26.3
          key: minecraft-26.3
      - name: Games root
        run: |
          mkdir -p "$RUNNER_TEMP/games"
          ln -sfn /skate-assets/mw2 "$RUNNER_TEMP/games/mw2"
          echo "IW4L_GAMES=$RUNNER_TEMP/games" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/config" >> "$GITHUB_ENV"
      - run: cargo build --profile play -p launcher --bin iw4l -p approved_tests
      - name: crafting_table
        run: scripts/headless-display.sh target/play/approved_tests crafting_table
      # The run's verdict and logs; not its screenshots, which are pictures
      # of the games' assets.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crafting_table
          path: |
            iw4l-artifacts/approved-tests/*/run.json
            iw4l-artifacts/approved-tests/*/child_stdout.txt
            iw4l-artifacts/approved-tests/*/child_stderr.txt
            iw4l-artifacts/approved-tests/*/iw4l-artifacts/logs/latest.log
          if-no-files-found: warn
