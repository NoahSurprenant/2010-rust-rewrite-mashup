name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What needs no game data runs on GitHub's runners.
  checks:
    name: approved_tests unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p approved_tests
      # The Minecraft map's multiplayer wire and save formats, and its mobs'.
      - run: cargo test -p minecraft_terrain --lib multiplayer
      - run: cargo test -p minecraft_terrain --lib mob_sync
      # Inventory icons, the `minecraft:special` ones (chests, heads) included.
      - run: cargo test -p minecraft_terrain --lib icon
      # The update manifest a GitHub release publishes and the launcher reads.
      - run: cargo test -p updater

  # The approved crafting_table scenario plays the real game on the
  # Minecraft map, so it needs the owner's MW2 files, which only the
  # in-cluster runner has (mounted read-only at /skate-assets/mw2). The
  # runner can read them and reach the internet, so a pull request from a
  # fork never runs here; the repository also requires approval before an
  # outside contributor's workflow runs.
  crafting-table:
    name: crafting_table (MW2 + Minecraft, in-cluster)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: iw4l-k8s
    timeout-minutes: 60
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: play
      # Minecraft's files, fetched from Mojang on the first run.
      - uses: actions/cache@v4
        with:
          path: iw4l-artifacts/minecraft-26.3
          key: minecraft-26.3
      - name: Games root
        run: |
          mkdir -p "$RUNNER_TEMP/games"
          ln -sfn /skate-assets/mw2 "$RUNNER_TEMP/games/mw2"
          echo "IW4L_GAMES=$RUNNER_TEMP/games" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/config" >> "$GITHUB_ENV"
      - run: cargo build --profile play -p launcher --bin iw4l
      - run: cargo build --profile play -p approved_tests
      - name: crafting_table
        run: scripts/headless-display.sh target/play/approved_tests crafting_table
      # The run's verdict and logs; not its screenshots, which are pictures
      # of the games' assets.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crafting_table
          path: |
            iw4l-artifacts/approved-tests/*/run.json
            iw4l-artifacts/approved-tests/*/child_stdout.txt
            iw4l-artifacts/approved-tests/*/child_stderr.txt
            iw4l-artifacts/approved-tests/*/iw4l-artifacts/logs/latest.log
          if-no-files-found: warn

  # The approved minecraft_multiplayer scenario: a host and a client on the
  # Minecraft map through an iw4l-master the run starts on the loopback,
  # then both again on the same settings to see the host's world kept. Two
  # games at once, so the runner needs room for both (run.json records each
  # one's and the pair's peak memory).
  minecraft-multiplayer:
    name: minecraft_multiplayer (two games through a local master, in-cluster)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: iw4l-k8s
    timeout-minutes: 90
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: play
      - uses: actions/cache@v4
        with:
          path: iw4l-artifacts/minecraft-26.3
          key: minecraft-26.3
      - name: Games root
        run: |
          mkdir -p "$RUNNER_TEMP/games"
          ln -sfn /skate-assets/mw2 "$RUNNER_TEMP/games/mw2"
          echo "IW4L_GAMES=$RUNNER_TEMP/games" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/config" >> "$GITHUB_ENV"
      - run: cargo build --profile play -p launcher --bin iw4l
      - run: cargo build --profile play -p approved_tests -p iw4l-master
      - name: minecraft_multiplayer
        run: scripts/headless-display.sh target/play/approved_tests minecraft_multiplayer
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft_multiplayer
          path: |
            iw4l-artifacts/approved-tests/*/run.json
            iw4l-artifacts/approved-tests/*/*/child_stdout_*.txt
            iw4l-artifacts/approved-tests/*/*/child_stderr_*.txt
            iw4l-artifacts/approved-tests/*/*/iw4l-artifacts/logs/*.log
            iw4l-artifacts/approved-tests/*/master/master_*.txt
          if-no-files-found: warn

  # The approved dedicated_server scenario: `iw4l dedicated` on the Minecraft
  # map (headless, no player of its own) through an iw4l-master the run starts
  # on the loopback, a client that joins, leaves and comes back, and the server
  # stopped with SIGTERM and started again. One rendering game and the server
  # at once (run.json records the server's memory and CPU).
  dedicated-server:
    name: dedicated_server (a dedicated server and a client through a local master, in-cluster)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: iw4l-k8s
    timeout-minutes: 90
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: play
      - uses: actions/cache@v4
        with:
          path: iw4l-artifacts/minecraft-26.3
          key: minecraft-26.3
      - name: Games root
        run: |
          mkdir -p "$RUNNER_TEMP/games"
          ln -sfn /skate-assets/mw2 "$RUNNER_TEMP/games/mw2"
          echo "IW4L_GAMES=$RUNNER_TEMP/games" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/config" >> "$GITHUB_ENV"
      - run: cargo build --profile play -p launcher --bin iw4l
      - run: cargo build --profile play -p approved_tests -p iw4l-master
      - name: player key and admin unit tests (player_key, net identity and admins, console debug_admins)
        run: |
          cargo test --profile play -p player_key
          cargo test --profile play -p net --lib identity
          cargo test --profile play -p net --lib admins
          cargo test --profile play -p console --lib debug_admins
      - name: dedicated_server
        run: scripts/headless-display.sh target/play/approved_tests dedicated_server
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dedicated_server
          path: |
            iw4l-artifacts/approved-tests/*/run.json
            iw4l-artifacts/approved-tests/*/*/child_stdout_*.txt
            iw4l-artifacts/approved-tests/*/*/child_stderr_*.txt
            iw4l-artifacts/approved-tests/*/*/iw4l-artifacts/logs/*.log
            iw4l-artifacts/approved-tests/*/master/master_*.txt
          if-no-files-found: warn

  # The approved skate_multiplayer scenario: players skate on the Minecraft
  # map, first in a listen host's room (the client skates while the host
  # watches, then the other way round), then on a dedicated server, each
  # through an iw4l-master the run starts on the loopback. The skaters need
  # the owner's converted Skate 3 data as well as MW2, read-only from the
  # same mount (/skate-assets/skate-data/assets); the dedicated server runs
  # without it. The skate codec's and console's unit tests run here too, on
  # the build the scenario uses.
  skate-multiplayer:
    name: skate_multiplayer (listen host and dedicated server through a local master, in-cluster)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: iw4l-k8s
    timeout-minutes: 120
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: play
      - uses: actions/cache@v4
        with:
          path: iw4l-artifacts/minecraft-26.3
          key: minecraft-26.3
      - name: Games root
        run: |
          mkdir -p "$RUNNER_TEMP/games"
          ln -sfn /skate-assets/mw2 "$RUNNER_TEMP/games/mw2"
          echo "IW4L_GAMES=$RUNNER_TEMP/games" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/config" >> "$GITHUB_ENV"
          echo "IW4L_SKATE_ASSETS=/skate-assets/skate-data/assets" >> "$GITHUB_ENV"
      - run: cargo build --profile play -p launcher --bin iw4l
      - run: cargo build --profile play -p approved_tests -p iw4l-master
      - name: skate unit tests (net::skate, console skate)
        run: |
          cargo test --profile play -p net --lib skate
          cargo test --profile play -p console --lib debug_skate
      - name: skate_multiplayer
        run: scripts/headless-display.sh target/play/approved_tests skate_multiplayer
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skate_multiplayer
          path: |
            iw4l-artifacts/approved-tests/*/run.json
            iw4l-artifacts/approved-tests/*/*/child_stdout_*.txt
            iw4l-artifacts/approved-tests/*/*/child_stderr_*.txt
            iw4l-artifacts/approved-tests/*/*/iw4l-artifacts/logs/*.log
            iw4l-artifacts/approved-tests/*/master/master_*.txt
          if-no-files-found: warn
