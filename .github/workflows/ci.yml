name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The in-cluster scenarios on main, nightly (a push to main runs only the
  # checks on GitHub's runners).
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read
  # The scenario selection reads a pull request's changed files.
  pull-requests: read

# By event as well, so that a push to main does not cancel the nightly run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # What needs no game data runs on GitHub's runners.
  checks:
    name: approved_tests unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p approved_tests
      # The Minecraft map's multiplayer wire and save formats, and its mobs'.
      - run: cargo test -p minecraft_terrain --lib multiplayer
      - run: cargo test -p minecraft_terrain --lib mob_sync
      # Inventory icons, the `minecraft:special` ones (chests, heads) included.
      - run: cargo test -p minecraft_terrain --lib icon
      # Special items (chests, shulker boxes, heads, banners, shields) as 3D
      # models in hand and on the ground.
      - run: cargo test -p minecraft_terrain --lib special
      # The update manifest a GitHub release publishes and the launcher reads.
      - run: cargo test -p updater
      # How the master lists a room (a dedicated server by its whole name).
      - run: cargo test -p master_protocol


  # The game, its master and the scenarios' runner, built once on GitHub's
  # runners (the build needs no game data) for the in-cluster jobs below,
  # which only play. The in-cluster runner (one job at a time, on a node that
  # runs hot) builds nothing.
  play-build:
    name: play build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libxcursor-dev libxrandr-dev libxi-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: play
      - run: cargo build --profile play -p launcher --bin iw4l
      - run: cargo build --profile play -p approved_tests -p iw4l-master
      # A tar keeps the binaries' modes, which an artifact's zip drops.
      - name: Binaries
        run: tar -cf play-bins.tar -C target/play iw4l approved_tests iw4l-master
      - uses: actions/upload-artifact@v4
        with:
          name: play-bins
          path: play-bins.tar
          retention-days: 3
          if-no-files-found: error

  # Which in-cluster scenario jobs to run (scripts/ci-scenarios.sh): on a pull
  # request, those its changed files can affect (every job for shared code
  # or a path the script does not name; none for docs, charts, packaging or
  # the Windows updater); every job nightly and on a manual run; none on a
  # push to main.
  select:
    name: scenario selection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@v5
      - run: scripts/ci-scenarios.sh --self-test
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          case $EVENT in
            pull_request)
              # The files endpoint lists at most 3000; more runs every job.
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[].filename')
              if [ "$(printf '%s\n' "$files" | wc -l)" -ge 3000 ]; then
                matrix=$(scripts/ci-scenarios.sh all)
              else
                matrix=$(printf '%s\n' "$files" | scripts/ci-scenarios.sh)
              fi ;;
            schedule | workflow_dispatch) matrix=$(scripts/ci-scenarios.sh all) ;;
            *) matrix='{"include":[]}' ;;
          esac
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = '{"include":[]}' ]; then echo any=false; else echo any=true; fi >> "$GITHUB_OUTPUT"

  # The unit tests of what the in-cluster scenarios play, beside the build
  # rather than after it, so the scenarios need not wait for them.
  play-unit-tests:
    name: play unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libxcursor-dev libxrandr-dev libxi-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: play-tests
      # The host's command inbox: a client whose clock runs ahead of a host
      # that lost time is taken a command a tick, not retired.
      - name: net inbox unit tests
        run: cargo test --profile play -p net --lib authority::inbox
      # A host's own load deadline, long enough for a slow machine.
      - name: net host load deadline unit test
        run: cargo test --profile play -p net --lib session_core::progress_watch_tests
      # What a host sends a client of its Minecraft world: the mobs near it
      # ahead of a long edit log.
      - name: Minecraft host stream unit tests (render_anim minecraft_mp)
        run: cargo test --profile play -p render_anim --lib minecraft_mp
      # The Minecraft map's test settings (IW4L_MINECRAFT_SPAWN, IW4L_MINECRAFT_MOBS),
      # and the host's logged changes per chunk.
      - name: Minecraft test settings and host log unit tests (render_anim minecraft_settings, minecraft_world)
        run: |
          cargo test --profile play -p render_anim --lib minecraft_settings
          cargo test --profile play -p render_anim --lib minecraft_world::tests
      # A block's drop reaches the server whatever items the server dropped
      # itself, from inside the broken block; a log's and stone's loot (the
      # loot only with Minecraft's data JAR, which these runners lack).
      - name: Minecraft block drop unit tests (render_anim minecraft_entities)
        run: cargo test --profile play -p render_anim --lib minecraft_entities::tests
      - name: player key, admin and console socket unit tests (player_key, net identity and admins, console debug_admins and control)
        run: |
          cargo test --profile play -p player_key
          cargo test --profile play -p net --lib identity
          cargo test --profile play -p net --lib admins
          cargo test --profile play -p console --lib debug_admins
          cargo test --profile play -p console --lib control
      # The player key on the multiplayer options page, and `whoami copy`.
      - name: player key page unit tests (ui menu)
        run: cargo test --profile play -p ui --lib menu
      - name: skate unit tests (net::skate, console skate)
        run: |
          cargo test --profile play -p net --lib skate
          cargo test --profile play -p console --lib debug_skate
      # `iw4l --headless`: the flag, IW4L_HEADLESS and what it refuses; the
      # Minecraft screen and hotbar keys a headless player still has; the
      # skater bones a headless host poses a body from.
      - name: headless unit tests (bootstrap args, hud minecraft_inventory, render_anim skate::rig)
        run: |
          cargo test --profile play -p bootstrap --lib args
          cargo test --profile play -p hud --lib minecraft_inventory
          cargo test --profile play -p render_anim --lib skate::rig
          cargo test --profile play -p console --lib accepts_tests
      # A controller stick after a menu: let go (not exactly zero) hands it
      # back to gameplay; and `pad`, the controller the console drives.
      - name: controller stick unit tests (console gamepad, debug_pad)
        run: cargo test --profile play -p console --lib -- gamepad debug_pad
      # A zone read once (its file's cache dropped) and inflated to no spare
      # room: what a game holds while it walks a zone's assets.
      - name: zone read unit tests (asset_transport read_once, zone)
        run: cargo test --profile play -p asset_transport --lib -- read_once zone::tests

  # The approved scenarios that play the real game on the Minecraft map,
  # each in parts a job of its own (approved_tests <scenario> --part <part>),
  # so that no job keeps the runner loaded for long and the largest holds
  # two games, not more. They need the owner's MW2 files (and Skate 3's for
  # skate_multiplayer), which only the in-cluster runner has, mounted
  # read-only at /skate-assets. The runner can read them and reach the
  # internet, so a pull request from a fork never runs here; the repository
  # also requires approval before an outside contributor's workflow runs.
  #
  # Only a game a check needs a picture of draws (on lavapipe); the others
  # run `iw4l --headless`, as a dedicated server always does: no window, no
  # renderer, no sound, a third of the memory and far less CPU.
  #
  # - crafting_table: one game, drawn (icons, the crafting screen).
  # - minecraft_multiplayer: a listen host and a client, both headless,
  #   through an iw4l-master the run starts on the loopback. `world`: blocks both ways,
  #   the client's hand, then both again on the same settings to see the
  #   host's world kept. `mobs`: far from the host, its mobs.
  # - dedicated_server: `iw4l dedicated` (headless, no player of its own) and
  #   a headless client. `visits`: admin rights, the empty room, SIGTERM and the
  #   restart. `mobs`: far from the spawn, the server's mobs.
  # - skate_multiplayer: `listen`, a headless listen host (it poses the
  #   client's skater as the draw path does) and a headless client, both
  #   with the Skate 3 files;
  #   `dedicated`, a dedicated server (without them) and a headless client.
  #
  # run.json records each game's peak memory; the job's last step prints the
  # runner container's (cgroup) peak, page cache included.
  #
  # The games of a run share one loading cache (--cache shared): on 2 CPUs a
  # listen host that compiles every shader itself while its client does the
  # same can pass its own 120 s load deadline; with the cache shared, the
  # second game reads what the first one compiled.
  scenario:
    name: ${{ matrix.scenario }}${{ matrix.part && format(' {0}', matrix.part) || '' }} (${{ matrix.games }}, in-cluster)
    needs: [play-build, select]
    if: >-
      needs.select.outputs.any == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: iw4l-k8s
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # One at a time: the runner has 2 CPUs, and its node is shared.
      max-parallel: 2
      # The jobs, their parts and timeouts: scripts/ci-scenarios.sh (JOBS).
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      WGPU_BACKEND: vulkan
      # lavapipe sizes its render threads from the host's cores, not the
      # runner's CPU limit (2); the game's own pools (Bevy's task pools, the
      # terrain's generation and section threads, asset loading) already
      # follow the limit through available_parallelism.
      LP_NUM_THREADS: 4
      # The checkout, not where the binaries were built.
      IW4L_REPO_ROOT: ${{ github.workspace }}
      # No game is checked on what it plays aloud (there is no sound device
      # here either): no clips decoded, no samples kept.
      IW4L_SOUND: 'off'
      # A game that draws (crafting_table's) keeps every texture in memory on
      # lavapipe: MW2's at most 256 pixels a side. Its checks read item icons
      # and screens drawn from Minecraft's own files, which this leaves whole.
      IW4L_TEXTURE_MAX_SIZE: 256
      # And draws MW2's models (guns, bodies) without their meshes: none of its
      # checks reads one off the screen.
      IW4L_XMODEL_MESHES: 'off'
      # Two glibc arenas, not one a thread: less freed memory held back.
      MALLOC_ARENA_MAX: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: play-bins
      - name: Binaries
        run: |
          mkdir -p target/play
          tar -xf play-bins.tar -C target/play
          rm play-bins.tar
      # Minecraft's files, fetched from Mojang on the first run.
      - uses: actions/cache@v4
        with:
          path: iw4l-artifacts/minecraft-26.3
          key: minecraft-26.3
      - name: Games root
        run: |
          mkdir -p "$RUNNER_TEMP/games"
          ln -sfn /skate-assets/mw2 "$RUNNER_TEMP/games/mw2"
          echo "IW4L_GAMES=$RUNNER_TEMP/games" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/config" >> "$GITHUB_ENV"
          if [ "${{ matrix.skate }}" = true ]; then
            echo "IW4L_SKATE_ASSETS=/skate-assets/skate-data/assets" >> "$GITHUB_ENV"
          fi
      # What the steps above wrote or unpacked (the binaries, Minecraft's files)
      # stays in the page cache, which this job's memory counts: drop it
      # before the games start.
      - name: Drop the setup's file cache
        run: scripts/drop-file-cache.sh target/play iw4l-artifacts/minecraft-26.3
      - name: ${{ matrix.scenario }}${{ matrix.part && format(' --part {0}', matrix.part) || '' }}
        run: scripts/headless-display.sh target/play/approved_tests ${{ matrix.scenario }} ${{ matrix.part && format('--part {0}', matrix.part) || '' }} --cache shared
      - name: Job peak memory and CPU (runner container cgroup)
        if: always()
        run: |
          if [ -r /sys/fs/cgroup/cpu.stat ]; then
            usec=$(awk '$1 == "usage_usec" {print $2}' /sys/fs/cgroup/cpu.stat)
            echo "cpu.stat usage_usec $usec ($((usec / 1000000)) CPU-seconds)"
          fi
          [ -r /sys/fs/cgroup/memory.stat ] && grep -E '^(anon|file|shmem) ' /sys/fs/cgroup/memory.stat || true
          for f in memory.peak memory.max memory.current; do
            [ -r "/sys/fs/cgroup/$f" ] || continue
            v=$(cat "/sys/fs/cgroup/$f")
            case $v in max) echo "$f max" ;; *) echo "$f $v bytes ($((v / 1048576)) MiB)" ;; esac
          done
      # The run's verdict and logs; not its screenshots, which are pictures
      # of the games' assets.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scenario }}${{ matrix.part && format('-{0}', matrix.part) || '' }}
          path: |
            iw4l-artifacts/approved-tests/*/run.json
            iw4l-artifacts/approved-tests/*/child_stdout.txt
            iw4l-artifacts/approved-tests/*/child_stderr.txt
            iw4l-artifacts/approved-tests/*/iw4l-artifacts/logs/latest.log
            iw4l-artifacts/approved-tests/*/*/child_stdout_*.txt
            iw4l-artifacts/approved-tests/*/*/child_stderr_*.txt
            iw4l-artifacts/approved-tests/*/*/iw4l-artifacts/logs/*.log
            iw4l-artifacts/approved-tests/*/master/master_*.txt
          if-no-files-found: warn
