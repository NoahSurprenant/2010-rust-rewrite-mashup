# Builds ghcr.io/noahsurprenant/iw4l-master (packaging/iw4l-master/Dockerfile)
# for amd64, pushes it and signs it keyless (cosign, this workflow's GitHub
# identity). Tags: the commit (`sha-<full sha>`) and `latest` on main. A master
# and the games that use it must share master_protocol's version, so run the
# image built from the same commit as the players' release. Pull requests
# build only.
name: Master image

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/iw4l-master/**
      - crates/master_pin/**
      - crates/master_protocol/**
      - packaging/iw4l-master/**
      - .dockerignore
      - .github/workflows/master-image.yml
  pull_request:
    paths:
      - crates/iw4l-master/**
      - crates/master_pin/**
      - crates/master_protocol/**
      - packaging/iw4l-master/**
      - .dockerignore
      - .github/workflows/master-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Keyless signing: the workflow's GitHub OIDC token gets a short-lived
      # Sigstore certificate.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/noahsurprenant/iw4l-master
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/iw4l-master/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=iw4l-master
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=iw4l-master,mode=max' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Sign the image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/noahsurprenant/iw4l-master@${DIGEST}"
