name: Release

# The portable Windows folder players download (README, "How to play"),
# built for every pull request and published from main as a GitHub release
# tagged build-<run number> and marked latest. The asset keeps upstream's
# name, so releases/latest/download/2010-Rust-Rewrite-Mashup-windows-x64.zip
# is always the newest build.
#
# Nothing here needs a secret or a server. The archive is upstream's
# layout: iw4l.exe, the Skate 3 converter, licences, README.txt, plus
# iw4launcher.exe. No .env, master address or CA ships: iw4l.exe writes .env
# itself on first launch (crates/launcher/src/first_run.rs).
#
# Updates: both executables are built with this repository's newest release
# as their update URL (IW4L_DEFAULT_UPDATE_URL). iw4l.exe hands its start to
# iw4launcher.exe, which reads releases/latest/download/manifest.json (each
# file by SHA-256 and size, written and checked by iw4l-update-manifest),
# fetches what differs from GitHub over the public web PKI, checks it, and
# starts the game. Each release publishes manifest.json, iw4l.exe.zst and
# iw4launcher.exe beside the zip. docs/WINDOWS.md.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "charts/**", ".github/workflows/helm-charts.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "charts/**", ".github/workflows/helm-charts.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE: 2010-Rust-Rewrite-Mashup
  # The revision skate/crates was taken from (skate/converter/build.ps1).
  SKATE_ENGINE_REV: cb7968930f14dad38457e98720d1a274e469eec2

jobs:
  # The cross build `make build-windows` does (xtask/src/windows.rs), minus
  # the updater and its CA.
  game:
    name: iw4l.exe (cargo xwin)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET: x86_64-pc-windows-msvc
      IW4L_GIT_HASH: ${{ github.sha }}
      # The update URL both executables name for themselves (crates/updater),
      # for main's releases only: a pull request's build would replace itself
      # with the newest release.
      IW4L_DEFAULT_UPDATE_URL: ${{ github.event_name != 'pull_request' && format('{0}/{1}/releases/latest/download', github.server_url, github.repository) || '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          # The MSVC STL headers xwin fetches refuse clang older than 19.
          sudo apt-get install -y -qq clang-20 lld-20 llvm-20
          echo /usr/lib/llvm-20/bin >> "$GITHUB_PATH"
          rustup target add "$TARGET"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin
      # The MSVC CRT and Windows SDK cargo-xwin downloads: over ten minutes
      # uncached, so it is saved even when the build fails.
      - uses: actions/cache/restore@v4
        id: xwin
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-play
          cache-on-failure: true
      - run: cargo xwin build --profile play --locked --target "$TARGET" -p launcher --bin iw4l -p updater --bin iw4launcher
      - if: always() && steps.xwin.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-v1
      # crates/launcher/build.rs links with /STACK:8388608; a recursive zone
      # walk overflows the 1 MiB default (xtask/src/windows.rs checks the same).
      - name: Stack reserve
        run: |
          exe="target/$TARGET/play/iw4l.exe"
          file "$exe"
          reserve="$(objdump -p "$exe" | awk '/SizeOfStackReserve/ {print $2}')"
          echo "SizeOfStackReserve=0x$reserve"
          test "$((16#$reserve))" -ge 8388608
      - uses: actions/upload-artifact@v4
        with:
          name: iw4l-exe
          path: |
            target/x86_64-pc-windows-msvc/play/iw4l.exe
            target/x86_64-pc-windows-msvc/play/iw4launcher.exe
          if-no-files-found: error
          retention-days: 3

  # PyInstaller only builds for the platform it runs on, so this one is
  # Windows. Cached per skate engine revision and converter source.
  converter:
    name: iw4l-skate-convert.exe (PyInstaller)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        id: cache
        with:
          path: converter
          key: skate-convert-${{ env.SKATE_ENGINE_REV }}-${{ hashFiles('skate/converter/**', '.github/workflows/release.yml') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: SK8-ENGINE/skate-3-rust-engine
          ref: ${{ env.SKATE_ENGINE_REV }}
          path: skate-engine
          sparse-checkout: tools
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build
        run: |
          python -m pip install --disable-pip-version-check -r skate-engine/tools/requirements-setup.txt
          ./skate/converter/build.ps1 -SkateEngine skate-engine -Out converter
      # What the converter bundles, under the names upstream's zip uses.
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Licences
        run: |
          New-Item -ItemType Directory -Force converter/licenses | Out-Null
          Copy-Item skate-engine/tools/vendor/utt/LICENSE converter/licenses/UTT.txt
          Copy-Item skate-engine/tools/vendor/university/LICENSE-PROJECT.md converter/licenses/CustomEngineLayer.txt
          @'
          import importlib.metadata as md, pathlib, shutil, sys
          out = pathlib.Path('converter/licenses')
          shutil.copy(pathlib.Path(sys.base_prefix, 'LICENSE.txt'), out / 'Python.txt')
          for dist, name in (('numpy', 'NumPy.txt'), ('pillow', 'Pillow.txt')):
              files = [f.locate() for f in md.distribution(dist).files
                       if '.dist-info' in str(f) and f.name.upper().startswith(('LICENSE', 'COPYING'))]
              shutil.copy(max(files, key=lambda f: f.stat().st_size), out / name)
          '@ | python -
          Get-ChildItem -Recurse converter | Format-Table Length, FullName
      - uses: actions/upload-artifact@v4
        with:
          name: skate-converter
          path: converter
          if-no-files-found: error
          retention-days: 3

  package:
    name: Windows zip
    needs: [game, converter]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: update-manifest
      # The update a release publishes beside the zip: the game zstd-packed,
      # the launcher, and the manifest naming each by hash, checked as the
      # launcher checks it (crates/updater, iw4l-update-manifest).
      - name: Update manifest
        run: |
          mkdir -p update
          cp artifacts/iw4l-exe/iw4l.exe artifacts/iw4l-exe/iw4launcher.exe update/
          zstd -q -19 -T0 update/iw4l.exe -o update/iw4l.exe.zst
          cargo run -q --locked -p updater --bin iw4l-update-manifest -- write \
            --git "$GITHUB_SHA" --build "$GITHUB_RUN_NUMBER" --dir update --out update/manifest.json
          cargo run -q --locked -p updater --bin iw4l-update-manifest -- check --dir update update/manifest.json
          cat update/manifest.json
          rm update/iw4l.exe
          ls -l update
      # What the Windows job below updates from (file://): this run's game,
      # and its launcher with bytes appended (an overlay: the PE still runs),
      # so the launcher has to replace itself while it runs.
      - name: Update test
        run: |
          mkdir -p update-test
          cp artifacts/iw4l-exe/iw4l.exe artifacts/iw4l-exe/iw4launcher.exe update-test/
          printf 'iw4l update test\n' >> update-test/iw4launcher.exe
          zstd -q -3 -T0 update-test/iw4l.exe -o update-test/iw4l.exe.zst
          cargo run -q --locked -p updater --bin iw4l-update-manifest -- write \
            --git "$GITHUB_SHA" --build 999999 --dir update-test --out update-test/manifest.json
          cargo run -q --locked -p updater --bin iw4l-update-manifest -- check --dir update-test update-test/manifest.json
          rm update-test/iw4l.exe
          ls -l update-test
      - name: Assemble
        run: |
          dir="$RUNNER_TEMP/$PACKAGE"
          mkdir -p "$dir/skate/licenses"
          cp artifacts/iw4l-exe/iw4l.exe "$dir/"
          cp artifacts/iw4l-exe/iw4launcher.exe "$dir/"
          cp artifacts/skate-converter/iw4l-skate-convert.exe "$dir/skate/"
          cp artifacts/skate-converter/licenses/*.txt "$dir/skate/licenses/"
          # xtask/src/release.rs LEGAL_FILES: iw4l.exe has both fonts compiled in.
          cp LICENSE NOTICE crates/ui/assets/OFL-Oxanium.txt crates/console/assets/COPYING-FreeFont.txt "$dir/"
          { cat packaging/windows/README.txt; printf '\nBuild %s, commit %s\n' "$GITHUB_RUN_NUMBER" "${GITHUB_SHA:0:12}"; } |
            sed 's/$/\r/' > "$dir/README.txt"
          sed 's/$/\r/' "packaging/windows/Minecraft World.bat" > "$dir/Minecraft World.bat"
          # Exactly these files: nothing from a game, no .env, no keys.
          cd "$RUNNER_TEMP"
          find "$PACKAGE" -type f | sort > got.txt
          diff -u - got.txt <<EOF
          $PACKAGE/COPYING-FreeFont.txt
          $PACKAGE/LICENSE
          $PACKAGE/Minecraft World.bat
          $PACKAGE/NOTICE
          $PACKAGE/OFL-Oxanium.txt
          $PACKAGE/README.txt
          $PACKAGE/iw4l.exe
          $PACKAGE/iw4launcher.exe
          $PACKAGE/skate/iw4l-skate-convert.exe
          $PACKAGE/skate/licenses/CustomEngineLayer.txt
          $PACKAGE/skate/licenses/NumPy.txt
          $PACKAGE/skate/licenses/Pillow.txt
          $PACKAGE/skate/licenses/Python.txt
          $PACKAGE/skate/licenses/UTT.txt
          EOF
          mkdir -p "$GITHUB_WORKSPACE/release"
          zip -qrX "$GITHUB_WORKSPACE/release/$PACKAGE-windows-x64.zip" "$PACKAGE"
          ls -l "$GITHUB_WORKSPACE/release"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: release/${{ env.PACKAGE }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: update
          path: update/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: update-test
          path: update-test/
          if-no-files-found: error
          retention-days: 3

  # The self-update on real Windows (scripts/windows-update-handoff.ps1):
  # Build 49, the first release with iw4launcher.exe, stands in for an
  # installed older build that names the newest release as its update URL.
  windows-update:
    name: Windows update hand-off (windows-2025)
    needs: package
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: zip
      - uses: actions/download-artifact@v4
        with:
          name: update-test
          path: update-test
      - name: Releases
        run: |
          gh release download build-49 --pattern "$env:PACKAGE-windows-x64.zip" --dir old
          gh release download --pattern manifest.json --dir latest
          Get-Content latest/manifest.json
      - name: This run's update, from an older iw4l.exe (file://)
        run: ./scripts/windows-update-handoff.ps1 -Test local
      - name: The newest release, from Build 49 as published (GitHub)
        run: ./scripts/windows-update-handoff.ps1 -Test github

  release:
    name: Publish release
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: update
          path: update
      - name: Publish
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tag="build-$GITHUB_RUN_NUMBER"
          zip="release/$PACKAGE-windows-x64.zip"
          prev="$(gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | last | .tagName // empty')"
          {
            if [ -n "$prev" ]; then
              echo "Changes since $prev:"
              echo
              gh api "repos/$GH_REPO/compare/$prev...$GITHUB_SHA" \
                --jq '.commits[] | select(.parents | length == 1) | "- \(.commit.message | split("\n")[0]) (\(.sha[0:7]))"'
            else
              gh api "repos/$GH_REPO/commits/$GITHUB_SHA" \
                --jq '"- \(.commit.message | split("\n")[0]) (\(.sha[0:7]))"'
            fi
            echo
            echo "**Setup**: extract the zip into its own folder (not Program Files) and run \`iw4l.exe\`. It updates itself: each start fetches the newest build (checked by SHA-256) before playing, and \`IW4L_UPDATE=0\` in \`.env\` turns that off. A folder without \`iw4launcher.exe\` (an older build) does not: extract this zip over it once (your setup and settings stay). No game files are included; see the [README](https://github.com/$GH_REPO#readme)."
            echo
            echo "Build: $RUN_URL"
            echo
            echo "SHA-256 \`$(sha256sum "$zip" | cut -d' ' -f1)\`"
          } > notes.md
          cat notes.md
          gh release create "$tag" "$zip" update/manifest.json update/iw4l.exe.zst update/iw4launcher.exe \
            --target "$GITHUB_SHA" --latest \
            --title "Build $GITHUB_RUN_NUMBER (${GITHUB_SHA:0:7})" --notes-file notes.md
